<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>商户服务助手 · AI 客服对话演示</title>
<style>
:root{
  --brand:#3d63f5; --brand-2:#6a5cf0; --brand-ink:#2340b8; --brand-soft:#e9eeff;
  --ink:#1b2130; --ink2:#535c70; --ink3:#9098a9; --line:#e8eaf0; --page:#f2f3f7;
  --ok:#11905f; --ok-soft:#e5f5ee; --info:#2f63d8; --info-soft:#e8efff; --warn:#b86e00; --warn-soft:#fff3df; --bad:#cf3434; --bad-soft:#fdeceb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.tag{font-style:normal;display:inline-block;font-size:11px;line-height:18px;padding:0 7px;border-radius:5px;white-space:nowrap}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-info{background:var(--info-soft);color:var(--info)}.t-warn{background:var(--warn-soft);color:var(--warn)}.t-bad{background:var(--bad-soft);color:var(--bad)}
.hd{text-align:center;padding:22px 16px 6px}
.hd h1{font-size:18px;font-weight:600}
.hd p{font-size:12.5px;color:var(--ink3);max-width:760px;margin:4px auto 0}
.wrap{max-width:1120px;margin:0 auto;padding:14px 20px 40px;display:grid;grid-template-columns:390px minmax(0,1fr);column-gap:120px;align-items:start}

/* 手机 */
.phone{width:390px;height:800px;background:#11141b;border-radius:46px;padding:11px;position:sticky;top:14px;box-shadow:0 24px 50px -18px rgba(20,28,50,.35)}
.scr{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;overflow:clip;display:flex;flex-direction:column;background:linear-gradient(180deg,#e5ebff 0%,#efeaff 170px,#f6f7fb 330px)}
.sb{height:40px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:13px;font-weight:600}
.nav{height:44px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;font-weight:600;font-size:16.5px}
.nav i{position:absolute;left:16px;font-style:normal;font-size:24px;font-weight:300;top:4px}
.who{flex:none;margin:0 14px 4px;font-size:11.5px;color:var(--ink2);background:rgba(255,255,255,.6);border-radius:8px;padding:3px 9px}
.who b{font-weight:500;color:var(--ink)}
.who:empty{display:none}
.chat{flex:1;overflow-y:auto;padding:6px 14px 10px;display:flex;flex-direction:column;gap:14px;position:relative}
.chat>*{flex:none}
.hello{position:relative;padding-top:6px}
.hello h2{font-size:17px;font-weight:600;padding:6px 0 10px 4px}
.mascot{position:absolute;right:6px;top:-6px;width:70px;height:70px;border-radius:22px;background:linear-gradient(140deg,#7b8cff,#a58bff);display:grid;place-items:center;transform:rotate(8deg)}
.mascot::before{content:"";width:34px;height:26px;background:#fff;border-radius:12px 12px 12px 4px}
.mascot::after{content:"";position:absolute;width:20px;height:4px;background:#7b8cff;border-radius:2px;box-shadow:0 -6px 0 #7b8cff;top:34px}
.hello-card{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:12px}
.hello-card>p{font-size:13.5px;margin-bottom:8px}
.guess-h{color:var(--brand-2);font-size:13px;font-style:italic;font-weight:500;margin-bottom:8px}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{background:#fff;border-radius:18px;padding:7px 10px 7px 12px;font-size:12.5px;display:flex;justify-content:space-between;gap:4px;text-align:left}
.pill::after{content:"›";color:var(--ink3)}
.me{align-self:flex-end;max-width:78%;background:#dfe6ff;color:#1e3592;border-radius:14px 14px 4px 14px;padding:8px 12px;font-size:14px;white-space:pre-wrap;cursor:pointer;transition:box-shadow .2s}
.me.sel{box-shadow:0 0 0 2px var(--brand)}
.me.isbad.sel{box-shadow:0 0 0 2px var(--bad)}
.ai .nm{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.ai .nm i{width:24px;height:24px;border-radius:8px;background:linear-gradient(140deg,#7b8cff,#a58bff);display:inline-block;position:relative}
.ai .nm i::before{content:"";position:absolute;left:6px;top:7px;width:12px;height:9px;background:#fff;border-radius:4px 4px 4px 1px}
.ai .bub{background:#fff;border-radius:14px;padding:11px 12px;font-size:14px;word-break:break-word;cursor:pointer}
.ai.isbad .bub{box-shadow:0 0 0 1px #f4c4c2}
.acts{display:flex;justify-content:flex-end;gap:14px;margin-top:8px;font-size:11.5px;color:var(--ink3)}
.acts button.on{color:var(--brand)}
.more{font-size:12.5px;color:var(--ink2);margin-top:10px}
.more p{margin-bottom:6px}
.more span{display:block;background:#fff;border-radius:10px;padding:7px 12px;margin-bottom:6px;font-size:13px;color:var(--ink)}
.sys{align-self:center;font-size:11.5px;color:var(--ink2);background:rgba(0,0,0,.05);border-radius:10px;padding:3px 10px}
.end{align-self:stretch;text-align:center;font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.end::before,.end::after{content:"";flex:1;height:1px;background:var(--line)}
.typing{display:inline-flex;gap:4px;align-items:center;color:var(--ink3);font-size:12.5px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--ink3);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}

.card{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;white-space:normal;font-size:13px}
.card-h{display:flex;justify-content:space-between;gap:6px;padding:7px 10px;background:#f8f9fc;color:var(--ink2);font-size:12px;border-bottom:1px solid var(--line)}
.card-h.hl{background:linear-gradient(90deg,#eef1ff,#f6f3ff);color:var(--brand-ink)}
.card-b{padding:10px}
.card-f{padding:6px 10px;border-top:1px dashed var(--line);font-size:11px;color:var(--ink3)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.kpis small{display:block;font-size:11.5px;color:var(--ink3)}
.kpis b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.mname{font-weight:600;font-size:14px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-variant-numeric:tabular-nums}
.row+.row{border-top:1px solid #f1f2f6}
.row .k{color:var(--ink2)}
.row.em{font-weight:600}.row.w .v{color:var(--warn)}
.steps .st{display:flex;gap:10px;align-items:flex-start;position:relative;padding-bottom:9px}
.steps .st:last-child{padding-bottom:0}
.steps .st i{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:#cfd5e1;z-index:1}
.steps .st:not(:last-child)::before{content:"";position:absolute;left:4px;top:13px;bottom:-1px;width:1px;background:var(--line)}
.steps .st span{flex:1}.steps .st em{font-style:normal;font-size:12px;color:var(--ink3)}
.st.done i{background:var(--ok)}.st.cur i{background:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}.st.cur em{color:var(--brand)}
.st.unk i{background:#fff;border:1.5px dashed var(--warn)}.st.unk em{color:var(--warn)}.st.bad i{background:var(--bad)}.st.bad em{color:var(--bad)}
.cbtn{display:flex;gap:8px;margin-top:10px}
.cbtn span{flex:1;text-align:center;padding:6px 0;border-radius:8px;border:1px solid var(--line);font-size:12.5px}
.cbtn span.p{background:var(--brand);border-color:var(--brand);color:#fff}


.foot{flex:none;padding:6px 12px 16px;position:relative;z-index:3}
.newt{display:inline-flex;align-items:center;gap:3px;background:#fff;border-radius:8px;padding:3px 10px;font-size:12px;color:var(--ink2);margin-bottom:8px}
.inbar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:9px 10px 9px 12px;cursor:pointer}
.inbar.hint{box-shadow:0 0 0 1.5px var(--brand) inset;animation:pulse 1.8s infinite}
.mic{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:11px;flex:none}
.field{flex:1;font-size:14px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field.has{color:var(--ink)}
.send{width:30px;height:30px;border-radius:50%;background:#d6dae6;color:#fff;font-size:16px;flex:none;display:grid;place-items:center}
.send.on{background:var(--brand);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(61,99,245,.35)}50%{box-shadow:0 0 0 6px rgba(61,99,245,0)}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -12px 30px rgba(20,28,50,.18);transform:translateY(105%);transition:transform .25s ease;max-height:78%;display:flex;flex-direction:column;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.mask{position:absolute;inset:0;background:rgba(15,20,35,.28);z-index:4;opacity:0;pointer-events:none;transition:opacity .25s}
.mask.open{opacity:1;pointer-events:auto}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px;font-weight:600;flex:none}
.sh-h small{display:block;font-weight:400;font-size:12px;color:var(--ink3)}
.sh-h button{font-size:22px;color:var(--ink3);font-weight:300;line-height:1}
.sh-b{overflow:auto;padding:4px 12px 20px}
.sh-sec{font-size:12px;color:var(--ink3);padding:10px 4px 6px;display:flex;justify-content:space-between}
.sh-sec.bad{color:var(--bad)}
.sc{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:9px 12px;border-radius:10px;margin-bottom:6px;background:#f6f7fb}
.sc:hover{background:#eef1fb}
.sc div{flex:1;min-width:0}
.sc b{display:block;font-weight:500;font-size:14px}
.sc small{display:block;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;font-size:14.5px;background:var(--brand-soft);color:var(--brand-ink);font-weight:500;box-shadow:0 0 0 1.5px var(--brand) inset}
.q small{display:block;font-weight:400;font-size:12px;color:var(--brand)}
.lnk{display:block;margin:14px auto 0;font-size:13px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.ended{text-align:center;padding:14px 6px 4px;color:var(--ink2);font-size:13.5px}
.ended div{display:flex;gap:8px;justify-content:center;margin-top:12px}
.ended button{padding:7px 16px;border-radius:18px;border:1px solid var(--line);font-size:13px}
.ended button.p{background:var(--brand);color:#fff;border-color:var(--brand)}

/* 说明 */
.ex{position:sticky;top:14px;max-height:800px;overflow-y:auto;padding-right:4px;position:sticky}
.intro{background:#fff;border:1px dashed #cdd4e4;border-radius:14px;padding:26px 24px;color:var(--ink2);font-size:14px}
.intro h3{font-size:15px;color:var(--ink);margin-bottom:10px}
.intro ol{padding-left:18px;line-height:2}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.ex-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ex-top h2{font-size:17px;font-weight:600;margin-right:auto}
.scene{font-size:13.5px;color:var(--ink2)}
.point{margin-top:8px;font-size:13.5px;font-weight:500;color:var(--ink)}
.pairl{margin-top:8px;font-size:12.5px;color:var(--ink3)}
.pairl button{color:var(--brand-ink);text-decoration:underline;text-underline-offset:3px}
.turn{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.turn.cur{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.turn.isbad.cur{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.turn.todo{background:transparent;border-style:dashed;color:var(--ink3);cursor:default;padding:9px 14px}
.th{display:flex;gap:8px;align-items:baseline}
.th b{font-size:12px;color:var(--ink3);font-weight:500;flex:none}
.th q{font-size:13.5px;quotes:"“" "”";flex:1}
.turn .bd{margin-top:6px;font-size:13.5px}
.turn .bd p+p{margin-top:4px}
.turn .bd em{font-style:normal;color:var(--ink3);font-size:12px;margin-right:6px}
.wrong,.right{margin-top:8px;border-radius:8px;padding:7px 10px;font-size:13.5px}
.wrong{background:var(--bad-soft);color:#8e1f1f}.right{background:var(--ok-soft);color:#0b5c3d;margin-top:6px}
.wrong b,.right b{font-weight:600;margin-right:6px}
.fin{border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:12px}
.fin.ok{background:var(--ok-soft);color:#0b5c3d}.fin.info{background:var(--info-soft);color:#1c3f94}.fin.warn{background:var(--warn-soft);color:#6f4200}.fin.bad{background:var(--bad-soft);color:#8e1f1f}
.fin b{font-weight:600;margin-right:6px}
.author{font-size:12.5px;color:var(--ink2);margin-top:8px;display:flex;gap:6px 14px;justify-content:center;flex-wrap:wrap;align-items:center}
.author b{color:var(--ink);font-weight:600}
.mail{color:var(--brand-ink);text-decoration:none;border-bottom:1px solid #cdd7fb}
.cp{font-size:11.5px;border:1px solid var(--line);border-radius:10px;padding:0 8px;background:#fff;color:var(--ink2)}
.quick{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.quick h4{font-size:13.5px;color:var(--ink);margin-bottom:8px}
.pairbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#f6f7fb;border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:13px}
.pairbtn:hover{background:#eef1fb}
.pairbtn span{color:var(--ink3)}
.pairbtn u{text-decoration:none;color:var(--brand-ink)}.pairbtn u.b{color:var(--bad)}
details.fw{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:12px}
details.fw summary{cursor:pointer;font-size:13.5px;font-weight:500;list-style:none;display:flex;justify-content:space-between}
details.fw summary::after{content:"展开 ▾";font-weight:400;font-size:12px;color:var(--ink3)}
details.fw[open] summary::after{content:"收起 ▴"}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 22px;margin-top:12px;counter-reset:f}
.flow div{position:relative;background:#f6f7fb;border-radius:10px;padding:8px 10px;font-size:12px;color:var(--ink2);counter-increment:f}
.flow div b{display:block;font-size:13px;color:var(--ink);font-weight:600}
.flow div b::before{content:counter(f) " · ";color:var(--brand)}
.flow div:not(:nth-child(3n))::after{content:"→";position:absolute;right:-17px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.fw p{font-size:12px;color:var(--ink3);margin-top:10px}
.about{max-width:1120px;margin:0 auto 40px;padding:0 20px}
.about div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px;display:flex;gap:10px 28px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink2)}
.about h3{font-size:15px;color:var(--ink)}
.about p{flex:1;min-width:260px}
.about a{color:var(--brand-ink)}
#wire{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50;overflow:visible}

@media (max-width:980px){
  .flow{grid-template-columns:1fr 1fr}.flow div::after{display:none}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px}
  .phone{width:100%;max-width:430px;height:min(760px,calc(100dvh - 40px));position:static;border-radius:28px;padding:7px}
  .scr{border-radius:22px}.sb{display:none}
  .ex{position:static;max-height:none;overflow:visible;width:100%;max-width:430px}
  #wire{display:none}
}
</style>
</head>
<body>
<header class="hd"><h1>商户服务助手 · AI 客服对话演示</h1><p>对话为预设脚本：点输入框选一个会话场景，按预设问题一步步提问。正常场景的回复由作者实现的处理规则生成，反例为人为构造；品牌、商户与数据均为虚构。</p>
<div class="author"><span>作者 <b>三桥君</b> · AI 产品经理｜支付商户服务 AI 客服｜把业务流程拆成 AI 能执行的规则</span><span class="mailbox"></span></div></header>
<div class="wrap">
  <div class="phone"><div class="scr" id="scr">
    <div class="sb"><span>9:41</span><span>▂▄▆ ▮</span></div>
    <div class="nav"><i>‹</i>商户服务助手</div>
    <div class="who" id="who"></div>
    <div class="chat" id="chat"></div>
    <div class="foot">
      <button class="newt" id="newt">＋ 新的话题</button>
      <div class="inbar" id="inbar"><span class="mic">))</span><span class="field" id="field"></span><button class="send" id="send" aria-label="发送">↑</button></div>
    </div>
    <div class="mask" id="mask"></div>
    <div class="sheet" id="sheet"><div class="sh-h" id="shh"></div><div class="sh-b" id="shb"></div></div>
  </div></div>
  <section class="ex" id="ex"></section>
</div>
<section class="about"><div><h3>关于作者 · 三桥君</h3><p>AI 产品经理，关注支付行业商户服务 AI 客服：商户一句话背后，AI 该不该自己答、该怎么答、答错了错在哪。这里的场景基于作者在支付机构负责商户服务 AI 客服的经验抽象而来，品牌、商户与数据均为虚构，不代表任何线上系统。</p><span>联系：<span class="mailbox"></span></span></div></section>

<script>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const yuan = n => (+n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const byId = id => D.stories.find(s => s.id === id);
const OUT = k => D.outcomes[k];
const wait = ms => new Promise(r => setTimeout(r, ms));
// gen：每次换场景加一；异步回放中途发现 gen 变了就停，避免上一场景的回复串到新场景
const S = { st: null, step: 0, draft: null, busy: false, sel: null, gen: 0, filter: null };
const chat = () => $('#chat');
const qOf = t => t.action === 'agent_accept' ? '（模拟）等待人工客服接入' : t.say;
const GUESS = [['商户交易查询', '帮我查一下昨天的交易'], ['商户到账查询', '昨天的钱为什么还没到账？'], ['变更结算卡', '怎么更换结算卡？'], ['账户状态查询', '我的账户是不是冻结了？'], ['到账金额差异', '昨天到账为什么比交易金额少了 12 元？'], ['联系人工客服', '我要找人工']];

// ---------- 场景开始 / 重置 ----------
function reset() {
  S.gen++; S.st = null; S.step = 0; S.draft = null; S.busy = false; S.sel = null;
  $('#who').innerHTML = '';
  chat().innerHTML = `<div class="hello"><div class="mascot" aria-hidden="true"></div><h2>你好，我是商户服务助手~</h2><div class="hello-card"><p>有什么问题尽管问我吧！</p><div class="guess-h">✦ 猜你想问</div><div class="pills">${GUESS.map(([l, q]) => `<button class="pill" data-q="${esc(q)}">${esc(l)}</button>`).join('')}</div></div></div>`;
  chat().querySelectorAll('.pill').forEach(b => b.onclick = () => { S.filter = b.dataset.q; openSheet(); });
  refreshInput(); closeSheet(); renderEx();
}
function start(id) {
  reset();
  S.st = byId(id);
  const a = D.accounts[S.st.persona];
  $('#who').innerHTML = `当前登录 <b>${esc(a.name)}</b> · ${esc(a.role)} · ${esc(a.merchants.length > 1 ? `授权 ${a.merchants.length} 家门店` : a.merchants[0] || '无商户数据授权')}`;
  S.draft = S.st.turns[0];
  refreshInput(); renderEx();
  if (history.replaceState) history.replaceState(null, '', '#' + id);
}
const next = () => S.st ? S.st.turns[S.step] || null : null;
const ended = () => S.st && S.step >= S.st.turns.length;

function refreshInput() {
  const f = $('#field');
  f.textContent = S.draft ? qOf(S.draft) : ended() ? '本场景已结束，点这里换一个会话场景' : !S.st ? '点这里，选择一个会话场景' : '点这里，选择下一个问题';
  f.classList.toggle('has', !!S.draft);
  $('#send').classList.toggle('on', !!S.draft);
  $('#inbar').classList.toggle('hint', !S.draft && !S.busy);
}

// ---------- 下拉面板 ----------
function openSheet() {
  if (S.busy) return;
  const h = $('#shh'), b = $('#shb');
  if (!S.st || ended()) {
    const list = S.filter ? D.stories.filter(s => s.turns[0].say === S.filter) : D.stories;
    h.innerHTML = `<span>选择会话场景<small>${S.filter ? `「${esc(S.filter)}」在不同情况下的 ${list.length} 种对话` : `共 ${D.stories.length} 个，选一个开始；问题和回复都是预设好的`}</small></span><button id="shx" aria-label="关闭">×</button>`;
    let html = ended() ? `<div class="ended">这个会话已结束，没有后续问题了。<div><button id="again">再看一遍</button></div></div>` : '';
    for (const g of D.groups) {
      const ss = list.filter(s => s.group === g); if (!ss.length) continue;
      html += `<div class="sh-sec ${g === '反例' ? 'bad' : ''}"><span>${g}</span><span>${ss.length}</span></div>` +
        ss.map(s => `<button class="sc" data-id="${s.id}"><div><b>${esc(s.title)}</b><small>${esc(s.turns.filter(t => t.say).map(t => t.say).join(' → '))}</small></div><i class="tag t-${OUT(s.outcome).tone}">${OUT(s.outcome).label}</i></button>`).join('');
    }
    if (S.filter) html += `<button class="lnk" id="all">查看全部会话场景</button>`;
    b.innerHTML = html;
    b.querySelectorAll('[data-id]').forEach(x => x.onclick = () => { S.filter = null; start(x.dataset.id); });
    const al = b.querySelector('#all'); if (al) al.onclick = () => { S.filter = null; openSheet(); };
    const ag = b.querySelector('#again'); if (ag) ag.onclick = () => start(S.st.id);
  } else {
    const n = next();
    h.innerHTML = `<span>下一个问题<small>${esc(S.st.title)} · 第 ${S.step + 1} / ${S.st.turns.length} 轮</small></span><button id="shx" aria-label="关闭">×</button>`;
    b.innerHTML = `<button class="q" id="pickq"><small>${n.action ? '商户这一步不用说话' : '按预设继续提问'}</small>${esc(qOf(n))}</button><button class="lnk" id="chg">换一个会话场景</button>`;
    b.querySelector('#pickq').onclick = () => { S.draft = n; refreshInput(); closeSheet(); };
    b.querySelector('#chg').onclick = () => { reset(); openSheet(); };
  }
  h.querySelector('#shx').onclick = closeSheet;
  b.scrollTop = 0;
  $('#sheet').classList.add('open'); $('#mask').classList.add('open');
}
function closeSheet() { $('#sheet').classList.remove('open'); $('#mask').classList.remove('open'); }
$('#mask').onclick = closeSheet;
$('#inbar').onclick = e => { if (e.target.closest('#send')) return; openSheet(); };
$('#send').onclick = () => S.draft ? send() : openSheet();
$('#newt').onclick = () => { S.filter = null; reset(); openSheet(); };

// ---------- 发送与回放 ----------
function add(html) { const d = document.createElement('div'); d.innerHTML = html; const el = d.firstElementChild; chat().append(el); chat().scrollTop = chat().scrollHeight; return el; }
async function send() {
  const t = S.draft; if (!t || S.busy) return;
  const g = S.gen, i = S.step;
  S.busy = true; S.draft = null; refreshInput();
  if (t.say) add(`<div class="me ${t.bad ? 'isbad' : ''}" data-i="${i}">${esc(t.say)}</div>`);
  if (t.action === 'agent_accept') { await wait(700); if (g !== S.gen) return; add(`<div class="sys" data-i="${i}">${esc(t.system || '人工客服已接入')}</div>`); }
  else if (t.reply) {
    const ty = add(`<div class="ai"><div class="nm"><i></i>助手</div><div class="bub"><span class="typing"><i></i><i></i><i></i>${t.reply.card ? '正在查询' : '正在输入'}</span></div></div>`);
    await wait(t.reply.card ? 1000 : 700); if (g !== S.gen) return;
    ty.remove(); add(aiHTML(t, i));
  }
  S.step++; S.busy = false; S.sel = i;
  if (ended()) add(`<div class="end">会话结束 · ${OUT(S.st.outcome).label}</div>`);
  bindChat(); refreshInput(); renderEx(); focusTurn(i, 'ex');
}
function aiHTML(t, i) {
  const r = t.reply;
  const more = (r.chips || []).filter(c => !['确认', '取消', '重试', '去验证', '去上传材料'].includes(c) && !/^第.笔$/.test(c) && r.card?.type !== 'choice');
  const bar = !['handoff', 'notice', 'confirm'].includes(r.card?.type);
  return `<div class="ai ${t.bad ? 'isbad' : ''}" data-i="${i}"><div class="nm"><i></i>助手</div><div class="bub"><span style="white-space:pre-wrap">${esc(r.text)}</span>${r.card ? card(r.card.type === 'choice' ? { ...r.card, says: r.chips } : r.card, null) : ''}
    ${bar ? `<div class="acts"><button data-fb>⧉ 复制</button><button data-fb>👍 已解决</button><button data-fb>👎 未解决</button></div>` : ''}</div>
    ${more.length ? `<div class="more"><p>你可能还想问：</p>${more.map(c => `<span>${esc(c)}</span>`).join('')}</div>` : ''}</div>`;
}
function bindChat() {
  chat().querySelectorAll('[data-i]').forEach(el => el.onclick = e => { if (e.target.closest('[data-fb]')) { e.target.closest('[data-fb]').classList.toggle('on'); return; } S.sel = +el.dataset.i; renderEx(); focusTurn(S.sel, 'ex'); });
}

  <div><b>商户一句话</b>先判断他想得到什么结果</div>

  const ex = $('#ex');
  if (!S.st) {
    ex.innerHTML = `<div class="intro"><h3>怎么看</h3><ol><li>点手机底部的输入框，选一个会话场景</li><li>点发送，AI 客服按预设回复</li><li>再点输入框，选下一个问题，直到这段对话结束</li><li>点对话里的任意一句，这里会连线显示它的解释</li></ol><p style="margin-top:12px;color:var(--ink3);font-size:12.5px">共 ${D.stories.length} 个会话场景：正常办理、先问清楚、系统异常、越界拦截、转人工，以及和正常场景对照的反例。</p>
      <div class="quick"><h4>赶时间？先看这两组对照</h4>${[['N1', 'B1'], ['H2', 'B3']].map(([a, b]) => `<button class="pairbtn" data-go="${a}"><u>${esc(byId(a).title)}</u><span>对照</span><u class="b" data-go="${b}">${esc(byId(b).title)}</u></button>`).join('')}<p style="font-size:12px;color:var(--ink3)">同一个问题，先看答对的，再看答错的。</p></div></div>${FW}`;
    ex.querySelectorAll('[data-go]').forEach(b => b.onclick = e => { e.stopPropagation(); start(e.target.closest('[data-go]').dataset.go); });
    return;
  }
  const st = S.st, o = OUT(st.outcome), pair = st.pair && byId(st.pair);
  let h = `<div class="box"><div class="ex-top"><i class="tag ${st.group === '反例' ? 't-bad' : 't-info'}">${esc(st.group)}</i><h2>${esc(st.title)}</h2><i class="tag t-${o.tone}">${o.label}</i></div>
    <p class="scene">${esc(st.summary.scene)}</p><p class="point">要点：${esc(st.summary.point)}</p>
    ${pair ? `<p class="pairl">对照：<button data-pair="${pair.id}">${esc(pair.title)}</button>（${OUT(pair.outcome).label}）</p>` : ''}</div>`;
  st.turns.forEach((t, i) => {
    if (i >= S.step) { h += `<div class="turn todo"><div class="th"><b>第 ${i + 1} 轮</b><q>${esc(qOf(t))}</q></div></div>`; return; }
    h += `<div class="turn ${t.bad ? 'isbad' : ''} ${S.sel === i ? 'cur' : ''}" data-t="${i}"><div class="th"><b>第 ${i + 1} 轮</b><q>${esc(qOf(t))}</q>${t.bad ? '<i class="tag t-bad">答错了</i>' : ''}</div>
      <div class="bd"><p><em>AI 做了什么</em>${esc(t.explain.did)}</p>${t.explain.why ? `<p><em>为什么</em>${esc(t.explain.why)}</p>` : ''}</div>
      ${t.bad ? `<div class="wrong"><b>错在哪</b>${esc(t.bad.wrong)}</div><div class="right"><b>正确的应该是</b>${esc(t.bad.right)}</div>` : ''}</div>`;
  });
  if (ended()) h += `<div class="fin ${o.tone}"><b>会话结束 · ${o.label}</b>${esc(st.summary.result)}</div>`;
  ex.innerHTML = h + FW;
  ex.querySelectorAll('[data-pair]').forEach(b => b.onclick = () => start(b.dataset.pair));
  ex.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { S.sel = +b.dataset.t; renderEx(); focusTurn(S.sel, 'chat'); });
  chat().querySelectorAll('.me').forEach(m => m.classList.toggle('sel', +m.dataset.i === S.sel));
}
// 只滚动对应的容器，不用 scrollIntoView（它会连带滚动手机外框）
function focusTurn(i, where) {
  if (where === 'ex') { const c = $(`#ex .turn[data-t="${i}"]`), ex = $('#ex'); if (c && ex.scrollHeight > ex.clientHeight) ex.scrollTo({ top: Math.max(0, c.offsetTop - ex.offsetTop - 120), behavior: 'smooth' }); }
  else { const m = chat().querySelector(`.me[data-i="${i}"]`) || chat().querySelector(`.ai[data-i="${i}"]`); if (m) chat().scrollTo({ top: Math.max(0, m.offsetTop - 80), behavior: 'smooth' }); }
}

// ---------- 连线：对话里选中的那一句 → 右侧对应的说明 ----------
function drawWire() {
  const svg = $('#wire');
  if (S.sel == null || !S.st || innerWidth <= 980) { svg.innerHTML = ''; return requestAnimationFrame(drawWire); }
  const src = chat().querySelector(`.me[data-i="${S.sel}"]`) || chat().querySelector(`.sys[data-i="${S.sel}"]`) || chat().querySelector(`.ai[data-i="${S.sel}"] .bub`);
  const dst = $(`#ex .turn[data-t="${S.sel}"]`);
  if (!src || !dst) { svg.innerHTML = ''; return requestAnimationFrame(drawWire); }
  const a = src.getBoundingClientRect(), b = dst.getBoundingClientRect(), c = chat().getBoundingClientRect(), e = $('#ex').getBoundingClientRect();
  let y1 = a.top + Math.min(a.height / 2, 18), y2 = b.top + 22;
  const off1 = y1 < c.top || y1 > c.bottom, off2 = y2 < e.top || y2 > e.bottom;
  y1 = Math.min(Math.max(y1, c.top + 6), c.bottom - 6); y2 = Math.min(Math.max(y2, e.top + 6), e.bottom - 6);
  const x1 = Math.max(a.right, a.left) + 6, x2 = b.left - 6, col = S.st.turns[S.sel]?.bad ? '#cf3434' : '#3d63f5';
  const dx = Math.max(40, (x2 - x1) / 2);
  svg.innerHTML = `<path d="M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="2" ${off1 || off2 ? 'stroke-dasharray="5 5"' : ''} opacity=".85"/><circle cx="${x1}" cy="${y1}" r="4" fill="${col}"/><circle cx="${x2}" cy="${y2}" r="4" fill="#fff" stroke="${col}" stroke-width="2"/>`;
  requestAnimationFrame(drawWire);
}

function card(c, n) {
  switch (c.type) {
    case 'summary': return `<div class="card"><div class="card-h hl"><span>${esc(c.date)} 的交易汇总</span></div><div class="card-b"><div class="mname">${esc(c.merchant)}</div><div class="kpis">
      <div><small>交易金额(元)</small><b>${yuan(c.amount)}</b></div><div><small>手续费(元)</small><b>${yuan(c.fee)}</b></div><div><small>退款金额(元)</small><b>${yuan(c.refund)}</b></div><div><small>交易笔数(笔)</small><b>${c.count}</b></div></div></div></div>`;
    case 'txn': return `<div class="card"><div class="card-h"><span>交易明细 · ${esc(c.merchant)}</span><span>11-05</span></div><div class="card-b">${c.rows.map((r, i) => `<div class="row"><span class="k">${c.choose ? `第${i + 1}笔 · ` : ''}${esc(r.time)}</span><span>${yuan(r.amount)} 元 · ${esc(r.status)}</span></div>`).join('')}${c.choose ? `<div class="cbtn">${c.rows.map((_, i) => `<span class="${n && n.say === `第${i + 1}笔` ? 'p go' : ''}" data-say="第${i + 1}笔">第${i + 1}笔</span>`).join('')}</div>` : ''}</div></div>`;
    case 'settle': { const m = { 完成: 'done', 当前: 'cur', 未开始: '', 无法核实: 'unk', 退回: 'bad' };
      return `<div class="card"><div class="card-h"><span>结算进度 · ${esc(c.merchant)}</span><span>11-05 批次</span></div><div class="card-b"><div class="steps">${c.steps.map(([a, b]) => `<div class="st ${m[b] || ''}"><i></i><span>${esc(a)}</span><em>${esc(b)}</em></div>`).join('')}</div></div></div>`; }
    case 'breakdown': { const un = +(c.diff - c.explained).toFixed(2);
      return `<div class="card"><div class="card-h"><span>到账差额构成</span><span>11-05</span></div><div class="card-b"><div class="row"><span class="k">交易金额</span><span>${yuan(c.txnAmount)}</span></div>${c.items.map(i => `<div class="row"><span class="k">− ${esc(i.name)}</span><span>${yuan(i.amount)}</span></div>`).join('')}${un > 0 && !c.conflict ? `<div class="row w"><span class="k">− 暂未核实</span><span class="v">${yuan(un)}</span></div>` : ''}<div class="row em"><span class="k">实际到账</span><span>${yuan(c.arrived)}</span></div></div></div>`; }
    case 'account': return `<div class="card"><div class="card-h"><span>账户状态</span><span class="tag ${c.status === '正常' ? 't-ok' : 't-warn'}">${esc(c.status)}</span></div><div class="card-b">${c.since ? `<div class="row"><span class="k">开始时间</span><span>${esc(c.since)}</span></div>` : ''}${c.reason ? `<div class="row"><span class="k">原因</span><span>${esc(c.reason)}</span></div>` : ''}${c.required ? `<div class="row"><span class="k">需要补充</span><span style="text-align:right">${esc(c.required.replace('补充经营材料：', ''))}</span></div>` : ''}</div>${c.upload ? `<div class="cbtn" style="padding:0 10px 10px"><span class="p">去上传材料</span></div>` : ''}</div>`;
    case 'guide': return `<div class="card"><div class="card-h"><span>办理指引 · ${esc(c.title)}</span></div><div class="card-b"><div class="row"><span class="k">入口</span><span>${esc(c.entry.replace(/ - /g, ' › '))}</span></div><div class="cbtn"><span class="p">去办理</span></div></div></div>`;
    case 'knowledge': return `<div class="card"><div class="card-f" style="border:0">依据：${esc(c.title)}（${esc(c.version)}，已发布）</div></div>`;
    case 'confirm': return `<div class="card"><div class="card-h"><span>请确认修改 · ${esc(c.field)}</span></div><div class="card-b"><div class="row"><span class="k">原号码</span><span>${esc(c.from)}</span></div><div class="row em"><span class="k">新号码</span><span>${esc(c.to)}</span></div><div class="cbtn"><span data-say="取消">取消</span><span class="p ${n && n.say === '确认' ? 'go' : ''}" data-say="确认">确认</span></div></div></div>`;
    case 'change': return `<div class="card"><div class="card-h"><span>修改申请 ${esc(c.id)}</span><span class="tag t-info">${esc(c.state)}</span></div><div class="card-b"><div class="steps"><div class="st done"><i></i><span>已提交</span><em>完成</em></div><div class="st cur"><i></i><span>审核中</span><em>当前</em></div><div class="st"><i></i><span>已生效</span><em>未开始</em></div></div></div></div>`;
    case 'handoff': return `<div class="card"><div class="card-h"><span>人工客服</span><span class="tag t-warn">排队中</span></div><div class="card-b"><div class="row"><span class="k">排队</span><span>第 ${c.queue} 位</span></div><div class="row"><span class="k">工单</span><span>${esc(c.ticket)}</span></div></div><div class="card-f">${esc(c.note ? '交接信息 · ' + c.note : '对话记录和已查信息已同步给客服')}</div></div>`;
    case 'notice': return `<div class="card"><div class="card-h"><span>${esc(c.title)}</span><span class="tag t-warn">未成功</span></div><div class="card-b">${c.lines.map(l => `<div class="row"><span class="k">${esc(l)}</span></div>`).join('')}</div></div>`;
    case 'choice': return `<div class="card"><div class="card-h"><span>请选择门店</span></div><div class="card-b">${c.options.map((o, i) => { const say = (c.says || [])[i]; return `<div class="row" ${say ? `data-say="${esc(say)}" style="cursor:pointer"` : ''}><span class="${n && n.say === say ? 'go' : ''}" style="${n && n.say === say ? 'color:var(--brand-ink);font-weight:500;border-radius:6px;padding:0 4px' : ''}">${esc(o)}</span><span class="k">›</span></div>`; }).join('')}</div></div>`;
  }
  return '';
}


const ML = ['conforest616', 'gmail.com'].join('@');
document.querySelectorAll('.mailbox').forEach(el => { el.innerHTML = `<a class="mail" href="mailto:${ML}">${ML}</a> <button class="cp">复制</button>`; el.querySelector('.cp').onclick = e => { const b = e.target; (navigator.clipboard ? navigator.clipboard.writeText(ML) : Promise.reject()).then(() => b.textContent = '已复制', () => b.textContent = ML); setTimeout(() => b.textContent = '复制', 1800); }; });
reset();
const h0 = location.hash.slice(1); if (byId(h0)) start(h0);
requestAnimationFrame(drawWire);
</script>
